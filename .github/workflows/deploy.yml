name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate GitHub Actions variables
        run: |
          missing=0
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Missing repository variable: VITE_API_URL"
            missing=1
          fi
          if [ -z "${{ vars.VITE_STREAM_API_URL }}" ]; then
            echo "::error::Missing repository variable: VITE_STREAM_API_URL"
            missing=1
          fi
          if [ -z "${{ vars.VITE_CLIENT_ID_GOOGLE }}" ]; then
            echo "::error::Missing repository variable: VITE_CLIENT_ID_GOOGLE (Google Sign-In button will not appear without this)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add them under: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STREAM_API_URL: ${{ vars.VITE_STREAM_API_URL }}
          VITE_CLIENT_ID_GOOGLE: ${{ vars.VITE_CLIENT_ID_GOOGLE }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
