[project]
name = "guardian-health"
version = "2.0.0"
description = "GuardianHealth — MongoDB auth + LangGraph LLM triage"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "GuardianHealth Team" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "motor>=3.6.0",
    "pymongo>=4.10.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.4.0",
    "passlib[pbkdf2]>=1.7.4",
    "google-auth>=2.0.0",
    "langgraph>=0.2.70",
    "langchain-core>=0.3.30,<1.0.0",
    "tenacity>=9.0.0",
    "json-repair>=0.35.0",
    "mangum>=0.19.0",
    "upstash-redis>=1.2.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "mongomock>=4.2.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
