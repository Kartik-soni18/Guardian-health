[project]
name = "guardian-health"
version = "2.0.0"
description = "GuardianHealth v2 — Zero-cost health record analysis with DynamoDB-only storage"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "GuardianHealth Team" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "python-multipart>=0.0.20",

    # --- Rate Limiting ---
    "slowapi>=0.1.9",

    # --- AWS / DynamoDB ---
    "aioboto3>=13.0.0,<14.0.0",

    # --- HTTP Client ---
    "httpx>=0.28.0,<1.0.0",

    # --- Validation & Settings ---
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",

    # --- Auth / Security ---
    "python-jose[cryptography]>=3.4.0",
    "passlib[pbkdf2]>=1.7.4",

    # --- AI / LangGraph ---
    "langgraph>=0.2.70",
    "langchain-core>=0.3.30,<1.0.0",

    # --- Resilience ---
    "tenacity>=9.0.0",

    # --- JSON Repair ---
    "json-repair>=0.35.0",

    # --- Caching (in-memory, NO Redis) ---
    "cachetools>=5.5.0",

    # --- PII Detection / Anonymization ---
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # --- ML / Scientific ---
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
    "numpy>=2.2.0",

    # --- Observability ---
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "respx>=0.22.0",
    "moto>=5.0.0",
    "pytest-cov>=6.0.0",

    # --- Linting / Formatting ---
    "black>=24.10.0",
    "ruff>=0.9.0",

    # --- Type Checking ---
    "mypy>=1.14.0",
]

[project.urls]
Repository = "https://github.com/your-org/guardian-health"
Documentation = "https://github.com/your-org/guardian-health#readme"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ==========================================
# Tool Configurations
# ==========================================

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "S",   # flake8-bandit
]
ignore = ["S105", "S106"]  # hardcoded passwords in test fixtures

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast, no external services)",
    "integration: Integration tests (may call external APIs in mock mode)",
    "slow: Slow tests (skip in CI unless explicitly requested)",
]
