version: "3.11"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: guardian-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me-immediately-32chars}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-guardian}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL:-}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_MODEL=${TOGETHER_MODEL:-meta-llama/Llama-3.3-70B-Instruct-Turbo}
      - MOCK_MODE=${MOCK_MODE:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,https://kartik-soni18.github.io}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - guardian-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: guardian-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - guardian-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: guardian-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - guardian-net
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local

networks:
  guardian-net:
    driver: bridge
    name: guardian-net
