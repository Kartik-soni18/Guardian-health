AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GuardianHealth API — FastAPI on Lambda (Function URL + response streaming)

Globals:
  Function:
    Timeout: 60
    MemorySize: 1536
    Architectures:
      - arm64

Parameters:
  SecretKey:
    Type: String
    NoEcho: true
  TogetherApiKey:
    Type: String
    NoEcho: true
  MongoDbUri:
    Type: String
  MongoDbName:
    Type: String
    Default: guardian_health
  UpstashRedisRestUrl:
    Type: String
  UpstashRedisRestToken:
    Type: String
    NoEcho: true
  AllowedOrigins:
    Type: String
    Default: https://kartik-soni18.github.io

Resources:
  GuardianApi:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: guardian-api
      DockerContext: .
      Dockerfile: backend/Dockerfile.lambda
    Properties:
      FunctionName: guardian-api
      PackageType: Image
      Environment:
        Variables:
          SECRET_KEY: !Ref SecretKey
          TOGETHER_API_KEY: !Ref TogetherApiKey
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          UPSTASH_REDIS_REST_URL: !Ref UpstashRedisRestUrl
          UPSTASH_REDIS_REST_TOKEN: !Ref UpstashRedisRestToken
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          MOCK_MODE: 'false'
          PORT: '8080'
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_READINESS_CHECK_PORT: '8080'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

Outputs:
  ApiEndpoint:
    Description: Lambda Function URL — set VITE_API_URL and VITE_STREAM_API_URL to this + /api/v1
    Value: !GetAtt GuardianApiUrl.FunctionUrl
  FunctionUrl:
    Description: Lambda Function URL for streaming and API traffic
    Value: !GetAtt GuardianApiUrl.FunctionUrl
